name: PR Checks - Build & Test

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  # The fail-closed half of the privacy guard. .gitignore stops accidents and the
  # Claude Code hook only ever sees Claude's git commands — this sees everything
  # that reaches a PR, whoever produced it. Rules live in .privacy-scan.json;
  # the engine is shared with my-finances and my-expenses via amajail/dev-kit.
  privacy:
    name: Privacy scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed lines for certificates, CUITs and credentials
        uses: amajail/dev-kit/actions/privacy-scan@v1

  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint check (if available)
        run: npm run lint --if-present
        continue-on-error: true
      
      - name: Build check
        run: npm run build --if-present
      
      - name: Run unit tests
        run: npm run test:unit
      
      - name: Run all tests with coverage
        run: npm run test:coverage
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for security vulnerabilities
        run: npm audit --audit-level=moderate
        continue-on-error: true
